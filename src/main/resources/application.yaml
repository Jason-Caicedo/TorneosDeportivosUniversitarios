spring:
  application:
    name: TorneosDeportivosUniversitarios

  datasource:
    url: "jdbc:postgresql://ep-fancy-wave-b7tjur6v-pooler.c-13.us-east-1.aws.neon.tech/neondb?sslmode=require"
    username: neondb_owner
    password: "npg_f7OuqwkjPHV5"
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Cache: "simple" = en memoria (no requiere instalar nada).
  # Para usar Redis ejecutar con el perfil "redis" (ver application-redis.yaml).
  cache:
    type: simple

  data:
    redis:
      repositories:
        enabled: false

  jackson:
    time-zone: America/Bogota

server:
  port: 8080

# ---------------- Seguridad JWT ----------------
jwt:
  # Minimo 32 caracteres (HS256)
  secret: "TorneosUniajcClaveSecretaSuperSeguraYExtensaParaFirmarTokensJWT2026"
  expiration-ms: 86400000   # 24 horas

# Usuario administrador que se crea automaticamente al iniciar (DataInitializer)
app:
  admin:
    username: admin
    email: admin@uniajc.edu.co
    password: "Admin123*"

# ---------------- Swagger / OpenAPI ----------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
