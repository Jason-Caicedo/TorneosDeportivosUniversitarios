# Perfil opcional: cache en Redis.
# Activar en IntelliJ: Run > Edit Configurations > Active profiles: redis
# Requiere Redis corriendo en localhost:6379 (ej: docker run -d -p 6379:6379 redis)
spring:
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
  data:
    redis:
      host: localhost
      port: 6379
